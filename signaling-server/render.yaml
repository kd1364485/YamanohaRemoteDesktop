services:
  - type: web
    name: yamanoha-signaling
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # ログインのトークンの署名鍵。Render が、デプロイのときにランダムな値を作る(リポジトリには書かない)
      - key: JWT_SECRET
        generateValue: true
