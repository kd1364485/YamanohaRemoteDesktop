# fly.toml app configuration file generated for yamanoha-signaling on 2026-06-25T10:30:36+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yamanoha-signaling'
primary_region = 'nrt'

[build]

[env]
  DB_PATH = '/data/data.db'
  PORT = '8080'

[[mounts]]
  source = 'yamanoha_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
