<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YamanohaRemoteDesktop</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body class="bg-[#0a0a0f] text-gray-100 min-h-screen flex flex-col">
    <!-- ヘッダー -->
    <header class="border-b border-white/10 px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">
        YamanohaRemoteDesktop
      </h1>
      <div id="connection-status" class="flex items-center gap-2 text-sm text-gray-400">
        <span class="w-2 h-2 rounded-full bg-gray-500"></span>
        <span>未接続</span>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex items-center justify-center p-8">
      <!-- ホーム画面 -->
      <div id="home-view" class="w-full max-w-2xl">
        <div class="grid grid-cols-2 gap-6">
          <!-- ホスト（共有）カード -->
          <button id="host-btn" type="button" class="group bg-gray-800/50 hover:bg-gray-800 border border-white/10 hover:border-blue-400/50 rounded-2xl p-8 transition-all duration-300 text-center">
            <div class="flex flex-col items-center gap-4">
              <div class="w-16 h-16 rounded-2xl bg-blue-500/10 group-hover:bg-blue-500/20 flex items-center justify-center transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" />
                </svg>
              </div>
              <div>
                <h2 class="text-lg font-semibold text-gray-100">このPCを共有</h2>
                <p class="text-sm text-gray-400 mt-1">他のデバイスからリモート接続を許可</p>
              </div>
            </div>
          </button>

          <!-- クライアント（接続）カード -->
          <button id="connect-btn" type="button" class="group bg-gray-800/50 hover:bg-gray-800 border border-white/10 hover:border-cyan-400/50 rounded-2xl p-8 transition-all duration-300 text-center">
            <div class="flex flex-col items-center gap-4">
              <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 group-hover:bg-cyan-500/20 flex items-center justify-center transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z" />
                </svg>
              </div>
              <div>
                <h2 class="text-lg font-semibold text-gray-100">リモートPCに接続</h2>
                <p class="text-sm text-gray-400 mt-1">接続コードを入力して接続</p>
              </div>
            </div>
          </button>
        </div>
      </div>

      <!-- ホスト待機画面 -->
      <div id="host-view" class="w-full max-w-2xl hidden">
        <div class="bg-gray-800/50 border border-white/10 rounded-2xl p-8">
          <div class="flex flex-col items-center gap-6">
            <h2 class="text-lg font-semibold text-gray-100">セッションホスト中</h2>
            <div class="w-12 h-12 rounded-full border-4 border-blue-400/30 border-t-blue-400 animate-spin"></div>
            <div class="text-center">
              <p class="text-sm text-gray-400 mb-2">接続コード</p>
              <div id="connection-code" class="text-3xl font-mono font-bold text-blue-400 tracking-wider">------</div>
            </div>
            <p class="text-sm text-gray-400">接続を待っています...</p>
            <button id="cancel-host-btn" type="button" class="px-6 py-2.5 bg-gray-700 hover:bg-gray-600 text-gray-100 font-medium rounded-lg transition-colors">
              キャンセル
            </button>
          </div>
        </div>
      </div>

      <!-- 接続入力画面 -->
      <div id="connect-view" class="w-full max-w-2xl hidden">
        <div class="bg-gray-800/50 border border-white/10 rounded-2xl p-8">
          <div class="flex flex-col items-center gap-6">
            <h2 class="text-lg font-semibold text-gray-100">リモートPCに接続</h2>
            <div class="w-full">
              <label class="block text-sm text-gray-400 mb-2">接続コード</label>
              <input id="code-input" type="text" placeholder="接続コードを入力" class="w-full px-4 py-3 bg-gray-900 border border-white/10 rounded-lg text-gray-100 text-center text-2xl font-mono tracking-wider focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all" />
            </div>
            <button id="connect-submit-btn" type="button" class="w-full px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-semibold rounded-lg hover:from-cyan-400 hover:to-blue-400 transition-all">
              接続
            </button>
            <button id="back-btn" type="button" class="text-sm text-gray-400 hover:text-gray-200 transition-colors">
              戻る
            </button>
          </div>
        </div>
      </div>

      <!-- リモートデスクトップ画面 -->
      <div id="remote-view" class="w-full h-full hidden">
        <div class="flex flex-col h-full gap-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
              <span class="text-sm text-gray-300">接続中</span>
            </div>
            <button id="disconnect-btn" type="button" class="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-medium rounded-lg transition-colors text-sm">
              切断
            </button>
          </div>
          <div class="flex-1 bg-black rounded-xl border border-white/10 flex items-center justify-center overflow-hidden">
            <canvas id="remote-canvas" class="max-w-full max-h-full"></canvas>
            <div id="remote-placeholder" class="text-gray-600 text-sm">
              リモート画面がここに表示されます
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ステータスバー -->
    <footer class="border-t border-white/10 px-6 py-2 flex items-center justify-between text-xs text-gray-500">
      <span id="session-info">YamanohaRemoteDesktop v0.1.0</span>
      <span id="latency-info"></span>
    </footer>
  </body>
</html>
